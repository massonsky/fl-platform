[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-client"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "scikit-learn==1.8.0",
  "torch==2.10.0",
  "grpcio==1.80.0",
  "protobuf==6.33.6",
]

[tool.setuptools.packages.find]
where = ["src"]
