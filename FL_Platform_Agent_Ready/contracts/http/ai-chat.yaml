{
  "ChatConversation": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "provider_id",
      "provider_name",
      "base_url",
      "model",
      "title",
      "created_at"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid"
      },
      "provider_id": {
        "type": "string",
        "format": "uuid"
      },
      "provider_name": {
        "type": "string"
      },
      "base_url": {
        "type": "string"
      },
      "model": {
        "type": "string"
      },
      "title": {
        "type": "string"
      },
      "created_at": {
        "type": "string",
        "format": "date-time"
      },
      "assistant_id": {
        "type": "string",
        "format": "uuid"
      },
      "assistant_revision": {
        "type": "integer",
        "minimum": 1
      },
      "assistant_name": {
        "type": "string"
      },
      "system_instruction": {
        "type": "string"
      }
    }
  },
  "ChatGeneration": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "request_id",
      "conversation_id",
      "input",
      "content",
      "status",
      "error_code",
      "finish_reason",
      "usage",
      "created_at",
      "deadline"
    ],
    "properties": {
      "request_id": {
        "type": "string",
        "format": "uuid"
      },
      "conversation_id": {
        "type": "string",
        "format": "uuid"
      },
      "input": {
        "type": "string"
      },
      "content": {
        "type": "string"
      },
      "status": {
        "type": "string",
        "enum": [
          "streaming",
          "completed",
          "failed",
          "cancelled",
          "interrupted"
        ]
      },
      "error_code": {
        "type": "string"
      },
      "finish_reason": {
        "type": "string"
      },
      "usage": {
        "type": "object",
        "nullable": true,
        "properties": {
          "prompt_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "completion_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "total_tokens": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "created_at": {
        "type": "string",
        "format": "date-time"
      },
      "deadline": {
        "type": "string",
        "format": "date-time"
      }
    }
  },
  "Conversations": {
    "get": {
      "operationId": "listConversations",
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "items"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "maxItems": 100,
                    "items": {
                      "$ref": "#/ChatConversation"
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    },
    "post": {
      "operationId": "createConversation",
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "provider_id",
                "model",
                "consent"
              ],
              "properties": {
                "provider_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "model": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 256
                },
                "consent": {
                  "type": "boolean",
                  "enum": [
                    true
                  ]
                },
                "assistant_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "assistant_revision": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          }
        }
      },
      "responses": {
        "201": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/ChatConversation"
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    }
  },
  "Conversation": {
    "parameters": [
      {
        "name": "conversationId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "get": {
      "operationId": "getConversation",
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "conversation",
                  "items"
                ],
                "properties": {
                  "conversation": {
                    "$ref": "#/ChatConversation"
                  },
                  "items": {
                    "type": "array",
                    "maxItems": 128,
                    "items": {
                      "$ref": "#/ChatGeneration"
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    },
    "delete": {
      "operationId": "deleteConversation",
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "deleted"
                ],
                "properties": {
                  "deleted": {
                    "type": "boolean"
                  }
                }
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    }
  },
  "Messages": {
    "parameters": [
      {
        "name": "conversationId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "sendChatMessage",
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "request_id",
                "content"
              ],
              "properties": {
                "request_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "content": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 32768
                }
              }
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "New generation SSE or persisted JSON replay; see AI_CHAT.md",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/ChatGeneration"
              }
            },
            "text/event-stream": {
              "schema": {
                "type": "string"
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    }
  },
  "Cancel": {
    "parameters": [
      {
        "name": "conversationId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "cancelChatGeneration",
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "cancelled"
                ],
                "properties": {
                  "cancelled": {
                    "type": "boolean"
                  }
                }
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
