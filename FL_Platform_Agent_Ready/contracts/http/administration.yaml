    "post": {
      "operationId": "createUser",
      "parameters": [
        {
          "$ref": "./common.yaml#/idempotencyKey"
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "./administration_resources.yaml#/CreateUser"
            }
          }
        }
      },
      "responses": {
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "description": "Existing idempotency/username/ownership conflict, or VERSION_CONFLICT when the target password/role/state changed during preparation. No prepared credential effect was committed by this request.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./common.yaml#/ApiError"
              }
            }
          }
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "description": "Shared client or current-actor credential budget exhausted before mutation. Reuse the same Idempotency-Key and body for an explicit retry.",
          "headers": {
            "Retry-After": {
              "schema": {
                "type": "integer",
                "minimum": 1
              },
              "description": "Whole seconds rounded up from the PostgreSQL budget; not a fixed cooldown."
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./common.yaml#/ApiError"
              }
            }
          }
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "description": "Credential work busy, missing limiter key/schema or dependency failure. Noncredential operations remain independent of the limiter.",
          "headers": {
            "Retry-After": {
              "schema": {
                "type": "integer",
                "enum": [
                  3
                ]
              }
            }
          },
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./common.yaml#/ApiError"
              }
            }
          }
        },
        "201": {
          "description": "Successful response",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./administration_resources.yaml#/Saved"
              }
            }
          }
        }
      },
      "description": "Session-bound credential work uses shared client/actor budgets and the same work permit as Login. A persisted exact replay requires current authorization but no new credential work or budget. New users do not receive organization membership or legacy-lab admission automatically."
    }
