{
  "Provider": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "id",
      "name",
      "base_url",
      "enabled",
      "revision",
      "has_key",
      "updated_at"
    ],
    "properties": {
      "id": {
        "type": "string",
        "format": "uuid"
      },
      "name": {
        "type": "string"
      },
      "base_url": {
        "type": "string"
      },
      "enabled": {
        "type": "boolean"
      },
      "revision": {
        "type": "integer"
      },
      "has_key": {
        "type": "boolean",
        "enum": [
          true
        ]
      },
      "updated_at": {
        "type": "string",
        "format": "date-time"
      }
    }
  },
  "Providers": {
    "get": {
      "operationId": "listAIProviders",
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "items",
                  "allowed_base_urls"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "maxItems": 20,
                    "items": {
                      "$ref": "#/Provider"
                    }
                  },
                  "allowed_base_urls": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "502": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    }
  },
  "ProviderItem": {
    "parameters": [
      {
        "name": "providerId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "put": {
      "operationId": "saveAIProvider",
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "base_url"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 80
                },
                "base_url": {
                  "type": "string",
                  "maxLength": 512
                },
                "api_key": {
                  "type": "string",
                  "maxLength": 4096,
                  "writeOnly": true
                },
                "enabled": {
                  "type": "boolean",
                  "default": false
                },
                "revision": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 2147483646,
                  "default": 0
                }
              }
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/Provider"
              }
            }
          }
        },
        "201": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/Provider"
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "502": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    }
  },
  "ProviderModels": {
    "parameters": [
      {
        "name": "providerId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    ],
    "post": {
      "operationId": "checkAIProviderModels",
      "responses": {
        "200": {
          "description": "Result",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "items"
                ],
                "properties": {
                  "items": {
                    "type": "array",
                    "maxItems": 1000,
                    "items": {
                      "type": "object",
                      "required": [
                        "id"
                      ],
                      "properties": {
                        "id": {
                          "type": "string",
                          "maxLength": 256
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "400": {
          "$ref": "./common.yaml#/Error"
        },
        "401": {
          "$ref": "./common.yaml#/Error"
        },
        "403": {
          "$ref": "./common.yaml#/Error"
        },
        "404": {
          "$ref": "./common.yaml#/Error"
        },
        "409": {
          "$ref": "./common.yaml#/Error"
        },
        "413": {
          "$ref": "./common.yaml#/Error"
        },
        "415": {
          "$ref": "./common.yaml#/Error"
        },
        "429": {
          "$ref": "./common.yaml#/Error"
        },
        "500": {
          "$ref": "./common.yaml#/Error"
        },
        "502": {
          "$ref": "./common.yaml#/Error"
        },
        "503": {
          "$ref": "./common.yaml#/Error"
        }
      }
    }
  }
}
