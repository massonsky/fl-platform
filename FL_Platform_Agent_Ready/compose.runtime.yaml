services:
  web:
    image: fl-platform/web:mvp
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:18080:80"]
    depends_on: [api]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: fl-platform/control-plane:mvp
    environment:
      FL_AI_ENABLED: ${FL_AI_ENABLED:-false}
      FL_AI_ALLOWED_BASE_URLS: ${FL_AI_ALLOWED_BASE_URLS:-}
      FL_ORGANIZATIONS_ENABLED: ${FL_ORGANIZATIONS_ENABLED:-false}
      FL_ORGANIZATION_PROJECTS_ENABLED: ${FL_ORGANIZATION_PROJECTS_ENABLED:-false}
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    volumes: ["/opt/fl-platform/secrets:/run/secrets:ro"]
    ports: ["127.0.0.1:18081:8080", "127.0.0.1:18082:50051"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 1
    logging: &runtime_logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  orchestrator:
    image: fl-platform/control-plane:mvp
    entrypoint: ["/usr/local/bin/orchestrator"]
    restart: unless-stopped
    volumes: ["/opt/fl-platform/secrets:/run/secrets:ro"]
    depends_on: [api]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 1
    logging: *runtime_logs
  worker0: &worker
    image: fl-platform/ml-client:mvp
    build:
      context: .
      dockerfile: services/ml-client/Dockerfile
    restart: unless-stopped
    environment: {FL_CLIENT_INDEX: "0"}
    volumes: ["/opt/fl-platform/secrets/client_0:/run/secrets/client_token:ro", "/opt/fl-platform/secrets/server.crt:/run/secrets/server.crt:ro"]
    depends_on: [api]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 450m
    cpus: 1
    logging: *runtime_logs
  worker1:
    <<: *worker
    environment: {FL_CLIENT_INDEX: "1"}
    volumes: ["/opt/fl-platform/secrets/client_1:/run/secrets/client_token:ro", "/opt/fl-platform/secrets/server.crt:/run/secrets/server.crt:ro"]
  worker2:
    <<: *worker
    environment: {FL_CLIENT_INDEX: "2"}
    volumes: ["/opt/fl-platform/secrets/client_2:/run/secrets/client_token:ro", "/opt/fl-platform/secrets/server.crt:/run/secrets/server.crt:ro"]
  worker3:
    <<: *worker
    environment: {FL_CLIENT_INDEX: "3"}
    volumes: ["/opt/fl-platform/secrets/client_3:/run/secrets/client_token:ro", "/opt/fl-platform/secrets/server.crt:/run/secrets/server.crt:ro"]
  worker4:
    <<: *worker
    scale: ${FL_LOCAL_WORKER4_REPLICAS:-1}
    environment: {FL_CLIENT_INDEX: "4"}
    volumes: ["/opt/fl-platform/secrets/client_4:/run/secrets/client_token:ro", "/opt/fl-platform/secrets/server.crt:/run/secrets/server.crt:ro"]
