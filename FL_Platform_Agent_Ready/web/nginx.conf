server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/v1/ai/conversations { proxy_pass http://api:8080; proxy_read_timeout 130s; proxy_buffering off; client_max_body_size 64k; }
  location /api/ { proxy_pass http://api:8080; proxy_read_timeout 35s; client_max_body_size 64k; }
  location / { try_files $uri $uri/ /index.html; }
}
